<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sensory Mirror — Control Panel</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Sensory Mirror — Control Panel</h1>
    <p class="subtitle">Exactly one modality is active on the mirror at a time. Selecting one switches off whichever was active before it. Changes apply live, no restart needed.</p>
  </header>

  <main>
    <label class="modality-card" data-modality="proxemic">
      <input type="radio" name="active-modality" id="select-proxemic" value="proxemic" />
      <div class="modality-info">
        <h2>Proxemic</h2>
        <p>Body distance &amp; movement — bubble tube, glow rope, starfield.</p>
      </div>
      <span class="radio-dot"></span>
    </label>

    <label class="modality-card" data-modality="gesture">
      <input type="radio" name="active-modality" id="select-gesture" value="gesture" />
      <div class="modality-info">
        <h2>Intentional Facial Gesture</h2>
        <p>Held smile &amp; mouth-open — calming blue sky wash, jack-in-the-box popup.</p>
      </div>
      <span class="radio-dot"></span>
    </label>

    <label class="modality-card" data-modality="object">
      <input type="radio" name="active-modality" id="select-object" value="object" />
      <div class="modality-info">
        <h2>Object Recognition</h2>
        <p>ArUco-tagged items — cat plush, Pop It balls, Squeezibo, caterpillar.</p>
      </div>
      <span class="radio-dot"></span>
    </label>
  </main>

  <footer>
    <span id="status">Loading…</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
